<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Tập Thông Minh</title>
    <!-- Nhúng bộ icon đẹp mắt từ FontAwesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-icon {
            font-size: 50px;
            color: var(--primary-color);
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-muted);
            margin: 0;
        }

        /* Khung chứa danh sách các Unit */
        .unit-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        /* Thiết kế từng dòng Unit */
        .unit-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .unit-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(79, 70, 229, 0.1);
            border-color: #cbd5e1;
        }

        .unit-link {
            display: flex;
            align-items: center;
            padding: 20px 24px;
            text-decoration: none;
            color: inherit;
        }

        /* Biểu tượng bên trái của mỗi Unit */
        .unit-icon-box {
            width: 52px;
            height: 52px;
            background: #eef2ff;
            color: var(--primary-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-right: 20px;
            flex-shrink: 0;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .unit-card:hover .unit-icon-box {
            background: var(--primary-color);
            color: #ffffff;
        }

        /* Phần chữ hiển thị */
        .unit-info {
            flex-grow: 1;
            text-align: left;
        }

        .unit-number {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--primary-color);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .unit-title {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin: 0;
        }

        /* Mũi tên chỉ đường bên phải */
        .unit-arrow {
            color: #94a3b8;
            font-size: 18px;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .unit-card:hover .unit-arrow {
            color: var(--primary-color);
            transform: translateX(4px);
        }

        /* Hiệu ứng hoạt họa lắc nhẹ cho icon chính */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* Responsive cho màn hình điện thoại nhỏ */
        @media (max-width: 480px) {
            body { padding: 20px 10px; }
            .app-container { padding: 25px 20px; }
            h1 { font-size: 24px; }
            .unit-link { padding: 16px; }
            .unit-icon-box { width: 44px; height: 44px; font-size: 18px; margin-right: 14px; }
            .unit-title { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <!-- Icon chính ở đỉnh trang, bạn có thể đổi lớp icon tùy thích -->
            <div class="header-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <h1>CHƯƠNG TRÌNH HỌC TẬP MỚI</h1>
            <p class="subtitle">Hệ thống bài học trực tuyến chính thức - Click để vào học</p>
        </div>
        
        <ul class="unit-grid">
            
            <!-- Cấu trúc CARD UNIT 1 -->
            <li class="unit-card">
                <!-- Phần href="unit1.html" điền đúng tên file bài 1 của bạn -->
                <a href="unit1.html" class="unit-link">
                    <div class="unit-icon-box">
                        <i class="fa-solid fa-book-open"></i> <!-- Thay đổi icon ở đây -->
                    </div>
                    <div class="unit-info">
                        <div class="unit-number">Bài học số 01</div>
                        <h2 class="unit-title">Unit 1: Khởi Động & Làm Quen</h2>
                    </div>
                    <div class="unit-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                </a>
            </li>

            <!-- Cấu trúc CARD UNIT 2 -->
            <li class="unit-card">
                <!-- Phần href="unit2.html" điền đúng tên file bài 2 của bạn -->
                <a href="unit2.html" class="unit-link">
                    <div class="unit-icon-box">
                        <i class="fa-solid fa-star"></i> <!-- Thay đổi icon ở đây -->
                    </div>
                    <div class="unit-info">
                        <div class="unit-number">Bài học số 02</div>
                        <h2 class="unit-title">Unit 2: Khám Phá Kiến Thức Mới</h2>
                    </div>
                    <div class="unit-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                </a>
            </li>

            <!-- LẦN TỚI MUỐN THÊM UNIT 3: Bạn chỉ cần copy cụm <li> đến </li> ở trên, 
                 thả xuống ngay dưới dòng này, rồi sửa href="unit3.html" và tiêu đề là xong! -->

        </ul>
    </div>

</body>
</html>
